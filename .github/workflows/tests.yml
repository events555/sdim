name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly as well, so new releases of the dependencies get tested when nothing is pushed.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        deps: ["newest"]
        include:
          # Every runtime dependency pinned at the floor pyproject.toml declares, read from that
          # file so the two cannot drift apart. pyproject.toml asks for cirq-core, not the cirq
          # metapackage, whose vendor packages would otherwise be resolved against these pins.
          - python-version: "3.11"
            deps: "floors"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - if: matrix.deps == 'newest'
        run: pip install -e . pytest stim
      - if: matrix.deps == 'floors'
        run: |
          python - > floors.txt <<'EOF'
          import tomllib
          for dep in tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]:
              print(dep.replace(">=", "=="))
          EOF
          cat floors.txt
          pip install -r floors.txt pytest stim
          pip install --no-deps -e .
      # test_tomography.py takes about 15 minutes; it runs on manual dispatch only.
      - run: python -m pytest -q --ignore=tests/test_tomography.py
      - if: github.event_name == 'workflow_dispatch'
        run: python -m pytest -q tests/test_tomography.py

  # The wheel publish.yml would upload, installed without -e and tested from site-packages.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - run: pip install dist/*.whl pytest stim
      # -P keeps the working directory off sys.path and --import-mode=append puts the checkout
      # after site-packages, so the tests import the installed sdim rather than the sources.
      - run: python -P -c "import sdim; assert 'site-packages' in sdim.__file__, sdim.__file__"
      - run: python -P -m pytest -q --import-mode=append --ignore=tests/test_tomography.py

  # The next Python with pre-releases of every dependency, so upcoming breakage shows up early.
  # It may fail without failing the workflow. stim is left out: it has no wheels there yet and
  # the tests that use it skip without it.
  canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          allow-prereleases: true
      - run: pip install --pre -e . pytest
      - run: python -m pytest -q --ignore=tests/test_tomography.py
