[tool.poetry]
name = "sdim"
version = "1.4.0"
description = "A fast stabilizer simulator for qudits, with Pauli frame sampling and detector error models"
authors = ["Steven Nguyen <steven.n.nguyen@rutgers.edu>", "Adeeb Kabir <ask171@rutgers.edu>"]
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["quantum computing", "Clifford simulator", "qudits", "stabilizer", "quantum error correction", "detector error model"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

[tool.poetry.urls]
Homepage = "https://events555.github.io/sdim/sdim.html"
Repository = "https://github.com/events555/sdim"
Documentation = "https://events555.github.io/sdim/sdim.html"

[tool.poetry.dependencies]
python = "^3.11"
numpy = ">=1.25.0"
sympy = ">=1.12.1"
cirq = ">=1.0.0"
Diophantine = "*"
numba = "*"
networkx = "^3.4.2"

[tool.poetry.dev-dependencies]
pdoc = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
