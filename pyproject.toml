[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "sdim"
version = "2.0.0"
description = "A tableau Clifford simulator for qudits"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Steven Nguyen", email = "steven.n.nguyen@rutgers.edu" },
]
keywords = ["quantum computing", "Clifford simulator", "qudits"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.25.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "ty", "sympy"]
interop = ["cirq"]

[project.urls]
Homepage = "https://events555.github.io/sdim/sdim.html"
Repository = "https://github.com/events555/sdim"
Documentation = "https://events555.github.io/sdim/sdim.html"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "sdim._sdim_rs"
manifest-path = "crates/sdim-py/Cargo.toml"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=sdim --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py311"
extend-exclude = ["examples/"]

[tool.ruff.lint]
select = ["F", "E9"]

[dependency-groups]
dev = [
    "pytest-benchmark>=5.2.3",
]
